spring:
  application:
    name: app-ticketing-nequi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: ${SERVER_PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  dynamodb:
    endpoint: ${AWS_DYNAMODB_ENDPOINT:http://localhost:4566}
    table-events: ${TABLE_EVENTS:ticketing-events}
    table-inventory: ${TABLE_INVENTORY:ticketing-inventory}
    table-orders: ${TABLE_ORDERS:ticketing-orders}
    table-order-history: ${TABLE_ORDER_HISTORY:ticketing-order-history}
    table-idempotency: ${TABLE_IDEMPOTENCY:ticketing-idempotency}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
    processing-queue-url: ${AWS_SQS_PROCESSING_QUEUE_URL:http://localhost:4566/000000000000/order-processing-queue}
    expiration-queue-url: ${AWS_SQS_EXPIRATION_QUEUE_URL:http://localhost:4566/000000000000/order-expiration-queue}
    poll-interval-ms: ${AWS_SQS_POLL_INTERVAL_MS:5000}

app:
  scheduler:
    expired-reservations-interval-ms: ${EXPIRED_RESERVATIONS_INTERVAL_MS:60000}

resilience4j:
  circuitbreaker:
    instances:
      createEventCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        recordExceptions: [co.com.nequi.ticketing.model.exception.TechnicalException]
        ignoreExceptions: [co.com.nequi.ticketing.model.exception.BusinessException]
      createOrderCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        recordExceptions: [co.com.nequi.ticketing.model.exception.TechnicalException]
        ignoreExceptions: [co.com.nequi.ticketing.model.exception.BusinessException]
      confirmOrderCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        recordExceptions: [co.com.nequi.ticketing.model.exception.TechnicalException]
        ignoreExceptions: [co.com.nequi.ticketing.model.exception.BusinessException]
      finalizeOrderCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        recordExceptions: [co.com.nequi.ticketing.model.exception.TechnicalException]
        ignoreExceptions: [co.com.nequi.ticketing.model.exception.BusinessException]

logging:
  level:
    root: INFO
    co.com.nequi.ticketing: DEBUG
